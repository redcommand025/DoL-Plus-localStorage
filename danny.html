<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DoL+ Danny Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
    #bar { padding: 8px; background: #222; font-size: 13px; }
    #bar button { margin: 4px 6px 0 0; padding: 6px 10px; background: #444; color: #fff; border: 1px solid #666; border-radius: 4px; }
    iframe { width: 100%; height: calc(100vh - 70px); border: none; }
  </style>
</head>
<body>
  <div id="bar">
    Loading game + Danny…
    <div>
      <button onclick="jump('Danny Room Door')">Danny Room Door</button>
      <button onclick="jump('Danny Room')">Danny Room</button>
    </div>
  </div>
  <iframe id="game" src="index.html"></iframe>
  <script>
    var frame = document.getElementById("game");
    var bar = document.getElementById("bar");
    var injected = false;

    function jump(passage) {
      try {
        var win = frame.contentWindow;
        if (win && win.SugarCube && win.SugarCube.State && win.SugarCube.State.display) {
          win.SugarCube.State.display(passage);
          bar.childNodes[0].textContent = "Jumped to " + passage;
        } else if (win && win.State && win.State.display) {
          win.State.display(passage);
          bar.childNodes[0].textContent = "Jumped to " + passage;
        } else {
          bar.childNodes[0].textContent = "Game not ready for jump";
        }
      } catch (e) {
        bar.childNodes[0].textContent = "Jump failed: " + e.message;
      }
    }

    function ensureDanny(win) {
      try {
        if (typeof win.registerModLI !== "function") return false;
        win.registerModLI("Danny");

        var V = win.State && win.State.variables;
        if (V) {
          if (!Array.isArray(V.NPCNameList)) V.NPCNameList = [];
          if (!Array.isArray(V.NPCName)) V.NPCName = [];
          if (V.NPCNameList.indexOf("Danny") === -1 && typeof win.Wikifier !== "undefined") {
            try {
              win.Wikifier.wikifyEval('<<newNamedNpc {nam: "Danny", title: "dependent", insecurity: "weak", teen: 1, adult: 0, type: "human", pronoun: "f", gender: "f", maxOrgasms: 1}>>');
            } catch (e) {}
          }
        }

        if (typeof win.Story !== "undefined" && typeof win.Story.add === "function") {
          function addP(name, content) {
            if (win.Story.has(name)) return;
            try { win.Story.add({ name: name, tags: "danny", content: content }); } catch (e) {}
          }
          addP("Danny Room Door",
            '<<if $time gte 1260 or $time lt 420>>\n' +
            '  A note on the door: "Sleeping. Please don\'t wake me."\n' +
            '  <<link "Wait until morning">><<set $time to 420>><<goto "Danny Room Door">><</link>>\n' +
            '<<elseif $schoolDay and $time gte 480 and $time lt 900>>\n' +
            '  A note: "At school. Back later."\n' +
            '  <<link "Leave">><<goto "Orphanage Hallway">><</link>>\n' +
            '<<else>>\n' +
            '  <<link "Knock and enter">><<goto "Danny Room">><</link>>\n' +
            '  <<link "Leave">><<goto "Orphanage Hallway">><</link>>\n' +
            '<</if>>'
          );
          addP("Danny Room",
            'You enter Danny\'s room. <<npc "Danny">> looks up.\n' +
            '<<if $dannyIntro isnot 1>>\n' +
            '  <<set $dannyIntro to 1>>\n' +
            '  "H-hey... I\'m Danny. I live here too. I have a weak bladder. Please don\'t tell Bailey."\n' +
            '  <<love "Danny" 5>>\n' +
            '<</if>>\n' +
            '<<link "Talk">><<love "Danny" 2>><<goto "Danny Room">><</link>>\n' +
            '<<link "Help with control training">><<set $danny.control += 5>><<love "Danny" 3>><<goto "Danny Room">><</link>>\n' +
            '<<link "Offer dependency care">><<set $danny.dependency += 5>><<love "Danny" 4>><<goto "Danny Room">><</link>>\n' +
            '<<link "Leave">><<goto "Orphanage Hallway">><</link>>'
          );
        }

        if (!win._dannyWatcher) {
          win._dannyWatcher = setInterval(function () {
            try {
              if (typeof win.registerModLI === "function") {
                if (!win.setup.modLIRegistry || win.setup.modLIRegistry.indexOf("Danny") === -1) {
                  win.registerModLI("Danny");
                }
              }
            } catch (e) {}
          }, 2000);
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function tick() {
      try {
        var win = frame.contentWindow;
        if (win && ensureDanny(win)) {
          var avail = (win.getAvailableModLIs && win.getAvailableModLIs()) || [];
          bar.childNodes[0].textContent = "Danny active. Available: " + (avail.length ? avail.join(", ") : "(checking…)") + "  ";
          injected = true;
        } else if (!injected) {
          bar.childNodes[0].textContent = "Waiting for game…  ";
        }
      } catch (e) {
        if (!injected) bar.childNodes[0].textContent = "Waiting…  ";
      }
    }

    frame.onload = function () {
      bar.childNodes[0].textContent = "Game frame loaded…  ";
      setTimeout(tick, 800);
      setInterval(tick, 3000);
    };
  </script>
</body>
</html>
